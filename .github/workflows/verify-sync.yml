name: Verify Replit Sync

on:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify sync integrity
        run: |
          echo "=== Replit sync received ==="
          echo "Commit SHA : ${{ github.sha }}"
          echo "Author     : ${{ github.event.head_commit.author.name }}"
          echo "Message    : ${{ github.event.head_commit.message }}"
          echo "Pushed by  : ${{ github.actor }}"
          echo ""
          echo "Checking key project files are present..."
          test -f package.json       && echo "  package.json        OK"
          test -f server/routes.ts   && echo "  server/routes.ts    OK"
          test -f shared/schema.ts   && echo "  shared/schema.ts    OK"
          test -f scripts/post-merge.sh && echo "  post-merge script   OK"
          echo ""
          echo "GitHub repo is in sync with Replit."
