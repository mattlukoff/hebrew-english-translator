name: Verify Replit Sync

on:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify required project files
        run: |
          echo "=== Replit sync received ==="
          echo "Commit SHA : ${{ github.sha }}"
          echo "Author     : ${{ github.event.head_commit.author.name }}"
          echo "Message    : ${{ github.event.head_commit.message }}"
          echo ""
          MISSING=0
          for f in package.json server/routes.ts shared/schema.ts scripts/post-merge.sh scripts/github-push.sh; do
            if [ -f "$f" ]; then
              echo "  $f  OK"
            else
              echo "  $f  MISSING" >&2
              MISSING=1
            fi
          done
          if [ "$MISSING" -eq 1 ]; then
            echo "ERROR: One or more required files are missing from the synced commit." >&2
            exit 1
          fi
          echo ""
          echo "All checks passed. GitHub is in sync with Replit."
